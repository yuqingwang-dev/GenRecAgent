source:
  prepared_path: data/processed/All_Beauty_full_optimized
  semantic_ids_path: outputs/m2_rqkmeans_full/item_semantic_ids.json
  output_path: data/processed/All_Beauty_m3
sequences:
  max_history: 20
retrieval:
  beam_size: 20
  max_codes: 20
  top_k: 20
transition:
  alpha: 10.0
evaluation:
  k_values: [5, 10, 20]
  output_path: outputs/m3_transition
transformer:
  output_path: outputs/m3_transformer
  d_model: 128
  n_heads: 4
  n_layers: 2
  feedforward_dim: 256
  dropout: 0.1
  epochs: 20
  batch_size: 128
  learning_rate: 0.0005
  gradient_clip: 1.0
  seed: 42
  device: auto
